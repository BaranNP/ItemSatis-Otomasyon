name: Build Windows EXE

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name SaticiDogrulama --icon assets/seller-icon.ico app.py
      - uses: actions/upload-artifact@v4
        with:
          name: SaticiDogrulama-Windows
          path: dist/SaticiDogrulama.exe
      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SaticiDogrulama.exe
